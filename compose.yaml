services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medprev}
      POSTGRES_USER: ${POSTGRES_USER:-medprev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medprev_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medprev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-medprev} -d ${POSTGRES_DB:-medprev}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medprev_postgres_data:
